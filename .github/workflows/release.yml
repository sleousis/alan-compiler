name: Release

on:
  push:
    # compiler tags only, not the extension's vscode-v* tags
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  # Builds, tests, packages and smoke-tests the six bundles with the CI jobs.
  bundles:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: alan-${{ github.ref_name }}-*
          path: assets
          merge-multiple: true

      - name: Compute checksums
        working-directory: assets
        run: |
          ls -l
          test "$(ls alan-* | wc -l)" -eq 6
          sha256sum alan-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            assets/alan-*
            assets/SHA256SUMS
          fail_on_unmatched_files: true
          # tags such as v2.0.0-rc.1 are prereleases
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Alan ${{ github.ref_name }} comes as a self-contained bundle for Windows, Linux and macOS on x64 and arm64, with alanc, its runtime library and the Zig toolchain it links with.
            On Linux or macOS, install it with `curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/alan-${{ github.ref_name }}-linux-x64.tar.gz | tar -xz` (use the file for your system), then run `alan/bin/alanc run hello.alan`.
            On Windows, run `curl.exe -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/alan-${{ github.ref_name }}-windows-x64.zip` and `tar -xf alan-${{ github.ref_name }}-windows-x64.zip`, and check any download against SHA256SUMS.
