name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same jobs for a tag and publishes the bundles.
  workflow_call:
    inputs:
      version:
        description: "version in the bundle names, such as v2.0.0"
        type: string
        required: true

permissions:
  contents: read

env:
  BISON_VERSION: "3.8.2"
  CMAKE_VERSION: "4.4.3"

jobs:
  compiler:
    name: compiler (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            zig: x86_64-windows
          - platform: windows-arm64
            os: windows-11-arm
            # zig 0.16.0 for aarch64-windows crashes whenever it links, so
            # the x86_64 build runs under emulation.
            zig: x86_64-windows
          - platform: linux-x64
            os: ubuntu-latest
            container: ubuntu:20.04
            zig: x86_64-linux
            cmake: x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            container: arm64v8/ubuntu:20.04
            zig: aarch64-linux
            cmake: aarch64
          - platform: macos-x64
            os: macos-26-intel
            zig: x86_64-macos
            llvm-arch: x86_64
            llvm-cache: 2
          - platform: macos-arm64
            os: macos-latest
            zig: aarch64-macos
            llvm-arch: arm64
            llvm-cache: 1
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      VERSION: ${{ inputs.version || 'dev' }}
      PYTHON: ${{ startsWith(matrix.platform, 'windows-') && 'python' || 'python3' }}
    defaults:
      run:
        # bash runs with pipefail, so a failed download fails its step
        shell: bash
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates gnupg xz-utils make flex m4 python3 \
            libzstd-dev zlib1g-dev libxml2-dev
          # The LLVM release libraries need a newer libstdc++ than Ubuntu 20.04 has.
          # alanc links it statically, so GCC 14 comes from the toolchain PPA.
          curl -fsSL --retry 5 "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F" \
            | gpg --dearmor > /etc/apt/trusted.gpg.d/ubuntu-toolchain-r.gpg
          echo "deb http://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" \
            > /etc/apt/sources.list.d/ubuntu-toolchain-r.list
          apt-get update
          apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-${{ matrix.cmake }}.tar.gz" \
            | tar -xz -C /opt
          echo "/opt/cmake-$CMAKE_VERSION-linux-${{ matrix.cmake }}/bin" >> "$GITHUB_PATH"
          cd /tmp
          curl -fsSL --retry 5 "https://ftp.gnu.org/gnu/bison/bison-$BISON_VERSION.tar.xz" | tar -xJ
          (cd "bison-$BISON_VERSION" && ./configure --prefix=/opt/bison && make -j"$(nproc)" && make install)
          echo "/opt/bison/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Read tool versions
        id: versions
        # llvm=23.1.2, zig=0.16.0 and so on
        run: sed -n 's/^\([A-Z]*\)_VERSION=\(.*\)$/\1=\2/p' tools/versions.env | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"

      # zig builds libc for a target on its first link, which takes minutes
      # (most on Windows ARM64, where zig runs under emulation), so keep its
      # global cache between runs. On Windows a debug link builds another
      # libc, so the key changed when the -g test came in.
      - name: Cache zig's libc builds
        uses: actions/cache@v6
        with:
          path: .zig-global-cache
          key: zig-${{ matrix.platform }}-${{ steps.versions.outputs.zig }}-g
          restore-keys: zig-${{ matrix.platform }}-${{ steps.versions.outputs.zig }}

      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"

      - name: Install zig (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 5 "https://ziglang.org/download/${{ steps.versions.outputs.zig }}/zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "ZIG_DIR=$RUNNER_TEMP/zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}" >> "$GITHUB_ENV"
          echo "ALAN_ZIG=$RUNNER_TEMP/zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}/zig" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Install zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri "https://ziglang.org/download/${{ steps.versions.outputs.zig }}/zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          "ZIG_DIR=$env:RUNNER_TEMP\zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}" >> $env:GITHUB_ENV
          "ALAN_ZIG=$env:RUNNER_TEMP\zig-${{ matrix.zig }}-${{ steps.versions.outputs.zig }}\zig.exe" >> $env:GITHUB_ENV
          "ZIG_GLOBAL_CACHE_DIR=$env:GITHUB_WORKSPACE\.zig-global-cache" >> $env:GITHUB_ENV

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: sh tools/build-linux.sh

      # Building LLVM takes about an hour. Bump llvm-cache in the matrix when
      # build_llvm_from_source in tools/build-macos.sh changes.
      - name: Restore LLVM built from source
        id: llvm-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm-*-${{ matrix.llvm-arch }}-macos
          key: llvm-src-${{ matrix.platform }}-${{ steps.versions.outputs.llvm }}-${{ matrix.llvm-cache }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: sh tools/build-macos.sh

      - name: Check for LLVM built from source
        id: llvm-built
        if: always() && runner.os == 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          if ls "$RUNNER_TEMP"/llvm-*-${{ matrix.llvm-arch }}-macos/complete >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save LLVM built from source
        if: always() && steps.llvm-built.outputs.found == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/llvm-*-${{ matrix.llvm-arch }}-macos
          key: llvm-src-${{ matrix.platform }}-${{ steps.versions.outputs.llvm }}-${{ matrix.llvm-cache }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1

      # The first link for a target builds zig's libc, which can take longer
      # than the test scripts allow for one program.
      - name: Warm up zig (Unix)
        if: runner.os != 'Windows'
        env:
          ALAN_RUNTIME: dist/${{ matrix.platform }}/lib/libalanrt.a
        run: dist/${{ matrix.platform }}/bin/alanc run Examples/HelloWorld.alan

      - name: Test (Unix)
        if: runner.os != 'Windows'
        env:
          ALAN_RUNTIME: dist/${{ matrix.platform }}/lib/libalanrt.a
        run: |
          python3 tests/run_examples.py --alanc dist/${{ matrix.platform }}/bin/alanc
          python3 tests/run_errors.py --alanc dist/${{ matrix.platform }}/bin/alanc

      - name: Warm up zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ALAN_RUNTIME: dist/${{ matrix.platform }}/lib/libalanrt.a
        run: dist/${{ matrix.platform }}/bin/alanc.exe run Examples/HelloWorld.alan

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ALAN_RUNTIME: dist/${{ matrix.platform }}/lib/libalanrt.a
        run: |
          python tests/run_examples.py --alanc dist/${{ matrix.platform }}/bin/alanc.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/run_errors.py --alanc dist/${{ matrix.platform }}/bin/alanc.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # alanc run must not leave linker side files behind
          $pdb = @(Get-ChildItem -Path $env:TEMP -Filter 'alan*.pdb')
          if ($pdb.Count -ne 0) { $pdb.FullName; exit 1 }

      # Windows gives main() its arguments in the ANSI code page. A source in
      # a folder with Greek letters and a space must still compile, build and
      # run, also when TEMP and TMP hold Greek letters. An error names the
      # file by its base name.
      - name: Test non-ASCII paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $alanc = (Resolve-Path "dist/${{ matrix.platform }}/bin/alanc.exe").Path
          $env:ALAN_RUNTIME = (Resolve-Path "dist/${{ matrix.platform }}/lib/libalanrt.a").Path
          $dir = Join-Path $env:RUNNER_TEMP 'Σάββας dir'
          $tmp = Join-Path $env:RUNNER_TEMP 'Προσωρινά αρχεία'
          New-Item -ItemType Directory -Force $dir, $tmp | Out-Null
          $src = Join-Path $dir 'Γειά σου.alan'
          Copy-Item Examples/HelloWorld.alan $src
          $want = [IO.File]::ReadAllText("$PWD\tests\expected\HelloWorld.txt")
          function Assert-Hello($what, $out) {
            if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" }
            $got = ($out | Out-String) -replace "`r", ''
            if ($got -ne $want) { throw "$what printed: $got" }
          }
          foreach ($greekTemp in $false, $true) {
            if ($greekTemp) { $env:TEMP = $tmp; $env:TMP = $tmp }
            Write-Host "TEMP=$env:TEMP"
            & $alanc check $src
            if ($LASTEXITCODE -ne 0) { throw "check failed with exit code $LASTEXITCODE" }
            Assert-Hello 'run' (& $alanc run $src)
            $exe = Join-Path $dir 'Γειά σου.exe'
            Remove-Item $exe -ErrorAction SilentlyContinue
            & $alanc build $src
            if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE" }
            Assert-Hello 'build' (& $exe)
            $dbg = Join-Path $dir 'Γειά debug.exe'
            & $alanc build -g $src -o $dbg
            if ($LASTEXITCODE -ne 0) { throw "build -g failed with exit code $LASTEXITCODE" }
            Assert-Hello 'build -g' (& $dbg)
            if (Test-Path (Join-Path $dir 'Γειά debug.pdb')) { throw 'build -g left a .pdb behind' }
          }
          $bad = Join-Path $dir 'Σφάλμα.alan'
          Copy-Item tests/errors/undeclared.alan $bad
          # Python reads stderr as bytes, whatever the console code page is.
          $check = @'
          import os, re, subprocess, sys
          r = subprocess.run([sys.argv[1], 'check', sys.argv[2]], capture_output=True)
          err = r.stderr.decode('utf-8')
          name = re.escape(os.path.basename(sys.argv[2]))
          if r.returncode != 1 or not re.match(name + r':3: error: ', err):
              sys.exit('exit %d, stderr: %r' % (r.returncode, err))
          '@
          & $env:PYTHON -c $check $alanc $bad
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The LLVM package for Windows has no LLDB, so take it from the
      # installer and keep only the files LLDB needs.
      - name: Cache LLDB (Windows)
        id: lldb-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lldb
          key: lldb-${{ matrix.platform }}-${{ steps.versions.outputs.llvm }}

      - name: Get LLDB (Windows)
        if: runner.os == 'Windows' && steps.lldb-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $msiArch = if ('${{ matrix.platform }}' -eq 'windows-arm64') { 'woa64' } else { 'win64' }
          $msi = Join-Path $env:RUNNER_TEMP 'llvm.msi'
          $unpacked = Join-Path $env:RUNNER_TEMP 'llvm-msi'
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ steps.versions.outputs.llvm }}/LLVM-${{ steps.versions.outputs.llvm }}-$msiArch.msi" -OutFile $msi
          # An administrative install only unpacks the files.
          $p = Start-Process msiexec -ArgumentList '/a', $msi, '/qn', "TARGETDIR=$unpacked" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          $bin = Join-Path $env:RUNNER_TEMP 'lldb\bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          foreach ($f in 'lldb.exe', 'liblldb.dll', 'lldb-server.exe', 'lldb-argdumper.exe') {
            Copy-Item (Join-Path $unpacked "LLVM\bin\$f") $bin
          }
          Remove-Item -Recurse -Force $msi, $unpacked

      # A program built with -g must show LLDB its source lines, frames and
      # variables. Linux gets lldb from apt.llvm.org, macOS has Xcode's and
      # Windows the one from the step above, which loads python3.dll from
      # the Python that setup-python put on the PATH.
      - name: Test debug information
        env:
          ALAN_RUNTIME: dist/${{ matrix.platform }}/lib/libalanrt.a
        run: |
          llvm="${{ steps.versions.outputs.llvm }}"
          case "${{ matrix.platform }}" in
            linux-*)
              curl -fsSL --retry 5 https://apt.llvm.org/llvm-snapshot.gpg.key \
                | gpg --dearmor > /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
              echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-${llvm%%.*} main" \
                > /etc/apt/sources.list.d/llvm.list
              apt-get update
              apt-get install -y "lldb-${llvm%%.*}"
              lldb="lldb-${llvm%%.*}"
              alanc="dist/${{ matrix.platform }}/bin/alanc" ;;
            macos-*)
              lldb=lldb
              alanc="dist/${{ matrix.platform }}/bin/alanc" ;;
            windows-*)
              lldb="$RUNNER_TEMP/lldb/bin/lldb.exe"
              alanc="dist/${{ matrix.platform }}/bin/alanc.exe" ;;
          esac
          "$lldb" --version
          $PYTHON tests/debug/lldb_check.py --alanc "$alanc" --lldb "$lldb"

      # The bundle carries the zig that the tests used. On Windows ARM64
      # that is the x86_64 build, which runs under emulation.
      - name: Package
        run: $PYTHON tools/package.py --platform ${{ matrix.platform }} --version "$VERSION" --zig "$ZIG_DIR"

      # Runs the extracted bundle the way a user would, so alanc must find
      # zig and the runtime inside it.
      - name: Smoke test the bundle
        run: |
          unset ALAN_ZIG ALAN_RUNTIME
          smoke="$RUNNER_TEMP/smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          case "${{ matrix.platform }}" in
            windows-*)
              $PYTHON -m zipfile -e "out/alan-$VERSION-${{ matrix.platform }}.zip" "$smoke"
              alanc="$smoke/alan/bin/alanc.exe"
              test -f "$smoke/alan/zig/zig.exe" ;;
            *)
              tar -xzf "out/alan-$VERSION-${{ matrix.platform }}.tar.gz" -C "$smoke"
              alanc="$smoke/alan/bin/alanc"
              test -x "$alanc"
              test -x "$smoke/alan/zig/zig" ;;
          esac
          test -f "$smoke/alan/lib/libalanrt.a"
          test -f "$smoke/alan/README.txt"
          tr -d '\r' < "$smoke/alan/VERSION" | grep -qx "$VERSION"
          "$alanc" run Examples/HelloWorld.alan > "$smoke/out.txt"
          tr -d '\r' < "$smoke/out.txt" | cmp - tests/expected/HelloWorld.txt

      # Lays the bundle out like a release for the installer tests below:
      # v0.0.0-ci holds it with its checksum, v0.0.0-bad a damaged copy with
      # the checksum of the good one, v0.0.0-none no bundle at all.
      - name: Prepare a release folder for the installers
        run: |
          case "${{ matrix.platform }}" in windows-*) ext=zip ;; *) ext=tar.gz ;; esac
          srv="$RUNNER_TEMP/srv/download"
          rm -rf "$RUNNER_TEMP/srv"
          mkdir -p "$srv/v0.0.0-ci" "$srv/v0.0.0-bad" "$srv/v0.0.0-none"
          good="alan-v0.0.0-ci-${{ matrix.platform }}.$ext"
          bad="alan-v0.0.0-bad-${{ matrix.platform }}.$ext"
          cp "out/alan-$VERSION-${{ matrix.platform }}.$ext" "$srv/v0.0.0-ci/$good"
          head -c 1000000 "$srv/v0.0.0-ci/$good" > "$srv/v0.0.0-bad/$bad"
          sum=$($PYTHON -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$srv/v0.0.0-ci/$good" | tr -d '\r')
          printf '%s  %s\n' "$sum" "$good" > "$srv/v0.0.0-ci/SHA256SUMS"
          printf '%s  %s\n' "$sum" "$bad" > "$srv/v0.0.0-bad/SHA256SUMS"
          : > "$srv/v0.0.0-none/SHA256SUMS"

      # Installs the bundle from a local server the way a user would, then
      # runs alanc from a shell with a clean environment.
      - name: Test the installer (Unix)
        if: runner.os != 'Windows'
        run: |
          unset ALAN_ZIG ALAN_RUNTIME
          $PYTHON -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/srv" > "$RUNNER_TEMP/http.log" 2>&1 &
          trap "kill $!" EXIT
          for i in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.2; done
          export ALAN_BASE_URL=http://127.0.0.1:8000
          dest="$HOME/.local/share/alan"
          # version, expected message, and whether an install must still be there
          expect_failure() {
            code=0
            ALAN_VERSION=$1 sh install/install.sh 2> "$RUNNER_TEMP/err.txt" || code=$?
            cat "$RUNNER_TEMP/err.txt"
            test "$code" -eq 1
            grep -q "$2" "$RUNNER_TEMP/err.txt"
            if [ "$3" = kept ]; then test -x "$dest/bin/alanc"; else test ! -e "$dest"; fi
            test ! -e "$dest.new"
            test ! -e "$dest.old"
          }
          run_installed() {
            env -i HOME="$HOME" PATH="$HOME/.local/bin:/usr/bin:/bin" ZIG_GLOBAL_CACHE_DIR="$ZIG_GLOBAL_CACHE_DIR" \
              sh -c 'test "$(command -v alanc)" = "$HOME/.local/bin/alanc" && alanc run Examples/HelloWorld.alan' \
              > "$RUNNER_TEMP/installed.txt"
            cmp "$RUNNER_TEMP/installed.txt" tests/expected/HelloWorld.txt
          }
          expect_failure v0.0.0-none "Alan v0.0.0-none has no download for ${{ matrix.platform }}" gone
          expect_failure v0.0.0-bad "Checksum mismatch" gone
          ALAN_VERSION=v0.0.0-ci sh install/install.sh
          # a second run replaces the first install
          ALAN_VERSION=v0.0.0-ci sh install/install.sh
          # a failed upgrade keeps the working install
          expect_failure v0.0.0-bad "Checksum mismatch" kept
          run_installed

      # Installs with PowerShell 7, then again with Windows PowerShell 5.1,
      # which must pick the same platform and keep one PATH entry. The user
      # PATH starts with an unexpanded %USERPROFILE% entry that must survive.
      # An upgrade with a locked file must fail and keep the old install. A
      # new shell reads PATH from the registry and runs alanc.
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:ALAN_ZIG, Env:ALAN_RUNTIME -ErrorAction SilentlyContinue
          $server = Start-Process $env:PYTHON -PassThru -NoNewWindow `
            -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', "$env:RUNNER_TEMP\srv" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\http.out" -RedirectStandardError "$env:RUNNER_TEMP\http.log"
          $dest = "$env:LOCALAPPDATA\alan"
          function Invoke-Installer($shell, $version) {
            $env:ALAN_VERSION = $version
            $out = & $shell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            @{ Code = $code; Out = $out }
          }
          function Assert-Failure($version, $message, [bool]$kept) {
            $r = Invoke-Installer pwsh $version
            if ($r.Code -ne 1) { throw "exit code $($r.Code) for $version" }
            if (-not $r.Out.Contains($message)) { throw "no message '$message'" }
            if ((Test-Path "$dest\bin\alanc.exe") -ne $kept) { throw "after $version the install is there: $(-not $kept)" }
            if (-not $kept -and (Test-Path $dest)) { throw "a failed install left $dest behind" }
            if ((Test-Path "$dest.new") -or (Test-Path "$dest.old")) { throw "a failed install left $dest.new or $dest.old behind" }
          }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $seed = '%USERPROFILE%\alan-ci-unexpanded'
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.SetValue('Path', ((@($raw -split ';' | Where-Object { $_ }) + $seed) -join ';'), [Microsoft.Win32.RegistryValueKind]::ExpandString)
          try {
            for ($i = 0; $i -lt 50; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            $env:ALAN_BASE_URL = 'http://127.0.0.1:8000'
            Assert-Failure 'v0.0.0-none' 'Alan v0.0.0-none has no download for ${{ matrix.platform }}.' $false
            Assert-Failure 'v0.0.0-bad' 'Checksum mismatch' $false
            foreach ($shell in 'pwsh', 'powershell') {
              $r = Invoke-Installer $shell 'v0.0.0-ci'
              if ($r.Code -ne 0) { throw "$shell failed with exit code $($r.Code)" }
              if (-not $r.Out.Contains('(${{ matrix.platform }})')) { throw "$shell picked the wrong platform" }
            }
            Assert-Failure 'v0.0.0-bad' 'Checksum mismatch' $true
            $lock = [IO.File]::Open("$dest\README.txt", 'Open', 'Read', 'None')
            try { Assert-Failure 'v0.0.0-ci' "Could not replace $dest" $true } finally { $lock.Close() }
          } finally {
            Stop-Process $server
          }
          if ($key.GetValueKind('Path') -ne 'ExpandString') { throw "the user PATH is now $($key.GetValueKind('Path'))" }
          $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if (-not ($raw -split ';' -contains $seed)) { throw "the user PATH lost $seed" }
          $bin = "$dest\bin"
          $user = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $bin })
          if ($user.Count -ne 1) { throw "the user PATH holds $bin $($user.Count) times" }
          $machine = @([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $bin })
          if ($machine.Count -ne 0) { throw "the machine PATH holds $bin" }
          pwsh -NoProfile -Command {
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $found = (Get-Command alanc).Source
            if ($found -ne "$env:LOCALAPPDATA\alan\bin\alanc.exe") { Write-Host "found $found"; exit 1 }
            alanc run Examples/HelloWorld.alan > "$env:RUNNER_TEMP\installed.txt"
            exit $LASTEXITCODE
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $got = [IO.File]::ReadAllText("$env:RUNNER_TEMP\installed.txt") -replace "`r", ''
          if ($got -ne [IO.File]::ReadAllText("$PWD\tests\expected\HelloWorld.txt")) { "got: $got"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: alan-${{ env.VERSION }}-${{ matrix.platform }}
          path: out/alan-${{ env.VERSION }}-${{ matrix.platform }}.*
          if-no-files-found: error
          # the archive is already compressed
          compression-level: 0
          # a release keeps its bundles for 90 days, a plain CI run for 7
          retention-days: ${{ inputs.version && 90 || 7 }}

  vscode:
    name: vscode (${{ matrix.os }})
    # A compiler release (release.yml) calls this workflow with a version and
    # does not need the extension, which vscode-release.yml releases.
    if: ${{ !inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # The end-to-end tests download VS Code and CodeLLDB into .vscode-test.
      - uses: actions/cache@v6
        with:
          path: |
            vscode/.vscode-test/vscode-*
            vscode/.vscode-test/extensions
          key: vscode-test-${{ runner.os }}-${{ hashFiles('vscode/package-lock.json') }}

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:grammar

      - name: End-to-end tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi

      - name: Package
        run: npx vsce package --out alan.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: alan-vscode-${{ matrix.os }}
          path: vscode/alan.vsix
          if-no-files-found: error
          retention-days: 7
